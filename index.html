
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080a0e">
<title>PRO CINEMA V5</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080a0e;color:white;font-family:Arial,sans-serif;overflow:hidden}
button,select,input{font:inherit}
button{cursor:pointer;color:white}
#camera{position:fixed;width:100%;height:100%;object-fit:contain;background:#000}
#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:8}
.top{position:fixed;top:0;width:100%;padding:18px;background:linear-gradient(#000c,transparent);display:flex;justify-content:space-between;align-items:center;z-index:3}
.logo{font-weight:bold;letter-spacing:2px;font-size:13px}
.tag{font-size:10px;color:#ffce69}
button{border:0;background:#ffffff20;border-radius:12px;padding:10px}
.controls{position:fixed;bottom:0;width:100%;padding:15px 15px 25px;background:linear-gradient(transparent,#000 22%);z-index:3}
.modes{display:flex;justify-content:center;gap:12px;margin:12px}
.modes button{font-size:12px}
.active{background:#e9b65c!important;color:#111!important}
.shutterRow{display:flex;justify-content:space-around;align-items:center;margin:15px 0}
.shutter{width:76px;height:76px;border:5px solid white;border-radius:50%;background:white;box-shadow:inset 0 0 0 5px #222}
.shutter.recording{background:#f33;border-radius:22px}
.side{width:48px;height:48px;border-radius:50%;font-size:20px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px}
.settings label{display:flex;flex-direction:column;gap:6px}
select{background:#252830;color:white;border:1px solid #555;border-radius:8px;padding:9px;width:100%}
input{width:100%;accent-color:#e9b65c}
#status{text-align:center;font-size:11px;color:#ccc;min-height:16px}
#timer{text-align:center;color:#ff6464;font-size:12px;height:17px}
#preview{position:fixed;inset:0;background:#080a0e;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:15px}
#preview img,#preview video{max-width:100%;max-height:75%;object-fit:contain}
.previewButtons{display:flex;gap:10px}
.previewButtons button{background:#e9b65c;color:#111}
</style>
</head>
<body>

<video id="camera" autoplay muted playsinline></video>
<div id="flash"></div>

<header class="top">
<div>
<div class="logo">PRO CINEMA V5</div>
<div class="tag">CAMERA EDITION</div>
</div>
<button id="quality">AUTO HD</button>
</header>

<section class="controls">
<div id="status">Tap START CAMERA</div>
<div id="timer"></div>

<div class="modes">
<button id="photoMode" class="active">PHOTO</button>
<button id="videoMode">VIDEO</button>
</div>

<div class="shutterRow">
<button class="side" id="switchCamera">🔄</button>
<button class="shutter" id="shutter"></button>
<button class="side" id="startCamera">📷</button>
</div>

<div class="settings">
<label>FILTER
<select id="filter">
<option value="none">Natural</option>
<option value="cinema">Cinematic</option>
<option value="warm">Golden Hour</option>
<option value="cool">Cool Tone</option>
<option value="mono">Black & White</option>
<option value="vintage">Vintage Film</option>
<option value="vivid">Vivid</option>
</select>
</label>

<label>PHOTO QUALITY
<select id="resolution">
<option value="max">Maximum Available</option>
<option value="4k">4K Target</option>
<option value="1080">1080p Target</option>
<option value="720">720p Target</option>
</select>
</label>

<label>ZOOM <span id="zoomValue">1.0x</span>
<input id="zoom" type="range" min="1" max="3" step=".1" value="1">
</label>

<label>EXPOSURE <span id="exposureValue">0</span>
<input id="exposure" type="range" min="-50" max="50" value="0">
</label>
</div>
</section>

<div id="preview">
<div class="logo">CAPTURE PREVIEW</div>
<img id="photoPreview" alt="Captured photo">
<video id="videoPreview" controls playsinline></video>
<div class="previewButtons">
<button id="save">SAVE</button>
<button id="close">BACK</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const video=$("camera");

let stream=null;
let facing="environment";
let mode="photo";
let recorder=null;
let chunks=[];
let recording=false;
let timerInterval=null;
let seconds=0;
let savedBlob=null;
let savedURL=null;
let savedExtension="jpg";
let actualWidth=0;
let actualHeight=0;

const filters={
none:"none",
cinema:"contrast(1.16) saturate(.83) sepia(.12)",
warm:"sepia(.23) saturate(1.25) contrast(1.08)",
cool:"saturate(.85) hue-rotate(12deg) contrast(1.1)",
mono:"grayscale(1) contrast(1.18)",
vintage:"sepia(.42) contrast(.9) saturate(.75)",
vivid:"saturate(1.45) contrast(1.1)"
};

function status(t){$("status").textContent=t}

function currentFilter(){
let f=filters[$("filter").value];
let b=1+Number($("exposure").value)/100;
return (f==="none"?"":f+" ")+"brightness("+b+")";
}

function updateFilter(){
video.style.filter=currentFilter();
video.style.transform=
"scale("+$("zoom").value+") "+
(facing==="user"?"scaleX(-1)":"");
}

async function startCamera(){
try{
stopTracks();
status("Opening camera...");

let quality=$("resolution").value;
let width=quality==="720"?1280:
quality==="1080"?1920:3840;
let height=quality==="720"?720:
quality==="1080"?1080:2160;

let constraints={
audio:false,
video:{
facingMode:{ideal:facing},
width:{ideal:width},
height:{ideal:height},
frameRate:{ideal:30}
}
};

try{
stream=await navigator.mediaDevices.getUserMedia(constraints);
}catch(e){
stream=await navigator.mediaDevices.getUserMedia({
video:{facingMode:{ideal:facing}},
audio:false
});
}

video.srcObject=stream;
await video.play();

let settings=stream.getVideoTracks()[0].getSettings();
actualWidth=settings.width||video.videoWidth;
actualHeight=settings.height||video.videoHeight;

$("quality").textContent=actualWidth+" × "+actualHeight;
status("CAMERA READY");
updateFilter();

}catch(e){
status("Camera error: "+e.message);
}
}

function stopTracks(){
if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}
}

async function switchCamera(){
if(recording)return;
facing=facing==="environment"?"user":"environment";
await startCamera();
}

function canvasFrame(){
let canvas=document.createElement("canvas");
let w=video.videoWidth,h=video.videoHeight;
let zoom=Number($("zoom").value);

canvas.width=w;
canvas.height=h;

let ctx=canvas.getContext("2d");
ctx.filter=currentFilter();

let sw=w/zoom,sh=h/zoom;
let sx=(w-sw)/2,sy=(h-sh)/2;

ctx.save();
if(facing==="user"){
ctx.translate(w,0);
ctx.scale(-1,1);
}
ctx.drawImage(video,sx,sy,sw,sh,0,0,w,h);
ctx.restore();

return canvas;
}

function showPreview(blob,extension){
if(savedURL)URL.revokeObjectURL(savedURL);

savedBlob=blob;
savedExtension=extension;
savedURL=URL.createObjectURL(blob);

$("photoPreview").style.display=
extension==="jpg"?"block":"none";
$("videoPreview").style.display=
extension==="webm"?"block":"none";

if(extension==="jpg"){
$("photoPreview").src=savedURL;
}else{
$("videoPreview").src=savedURL;
}

$("preview").style.display="flex";
}

async function takePhoto(){
if(!stream)return status("Start camera first!");

try{
let canvas=canvasFrame();

$("flash").style.opacity="0.8";
setTimeout(()=>$("flash").style.opacity="0",100);

canvas.toBlob(blob=>{
if(!blob)return status("Capture failed");
showPreview(blob,"jpg");
status("Photo captured!");
},"image/jpeg",.96);

}catch(e){
status("Photo error: "+e.message);
}
}

function supportedMime(){
let types=[
"video/webm;codecs=vp8",
"video/webm"
];
return types.find(t=>MediaRecorder.isTypeSupported(t))||"";
}

async function startRecording(){
if(!stream)return status("Start camera first!");

try{
let canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

let ctx=canvas.getContext("2d");
let active=true;

function draw(){
if(!active)return;
let frame=canvasFrame();
ctx.drawImage(frame,0,0);
requestAnimationFrame(draw);
}

draw();

let output=canvas.captureStream(30);
let mime=supportedMime();

recorder=new MediaRecorder(output,
mime?{mimeType:mime,videoBitsPerSecond:5000000}:{});

chunks=[];
recorder.ondataavailable=e=>{
if(e.data.size)chunks.push(e.data);
};

recorder.onstop=()=>{
active=false;
output.getTracks().forEach(t=>t.stop());
let blob=new Blob(chunks,{type:recorder.mimeType||"video/webm"});
showPreview(blob,"webm");
};

recorder.start(1000);
recording=true;
seconds=0;

$("shutter").classList.add("recording");
status("RECORDING");

timerInterval=setInterval(()=>{
seconds++;
let m=String(Math.floor(seconds/60)).padStart(2,"0");
let s=String(seconds%60).padStart(2,"0");
$("timer").textContent="● REC "+m+":"+s;
},1000);

}catch(e){
status("Recording error: "+e.message);
}
}

function stopRecording(){
if(!recording)return;
recording=false;
clearInterval(timerInterval);
recorder.stop();
$("shutter").classList.remove("recording");
$("timer").textContent="";
status("Recording complete");
}

$("shutter").onclick=()=>{
if(mode==="photo")takePhoto();
else if(recording)stopRecording();
else startRecording();
};

$("startCamera").onclick=startCamera;
$("switchCamera").onclick=switchCamera;

$("photoMode").onclick=()=>{
if(recording)return;
mode="photo";
$("photoMode").classList.add("active");
$("videoMode").classList.remove("active");
status("PHOTO MODE");
};

$("videoMode").onclick=()=>{
mode="video";
$("videoMode").classList.add("active");
$("photoMode").classList.remove("active");
status("VIDEO MODE");
};

$("filter").onchange=updateFilter;

$("zoom").oninput=()=>{
$("zoomValue").textContent=$("zoom").value+"x";
updateFilter();
};

$("exposure").oninput=()=>{
$("exposureValue").textContent=$("exposure").value;
updateFilter();
};

$("resolution").onchange=()=>{
if(!recording)startCamera();
};

$("save").onclick=()=>{
if(!savedBlob)return;

let a=document.createElement("a");
a.href=savedURL;
a.download="PRO_CINEMA_V5_"+Date.now()+"."+savedExtension;
document.body.appendChild(a);
a.click();
a.remove();

status("Save requested");
};

$("close").onclick=()=>{
$("preview").style.display="none";
$("videoPreview").pause();
};

window.addEventListener("beforeunload",stopTracks);

if(!navigator.mediaDevices?.getUserMedia){
status("Camera requires HTTPS or localhost");
}
</script>
</body>
</html>
