
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRO CINEMA V4</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#101114;
color:white;
font-family:Arial,sans-serif;
}
header{
background:#1c1d21;
padding:16px;
display:flex;
justify-content:space-between;
align-items:center;
}
.brand{font-weight:bold;letter-spacing:1px}
.red{color:#ff4545}
#preview{
width:100%;
aspect-ratio:16/9;
background:black;
object-fit:contain;
}
.panel{padding:16px}
section{
border-bottom:1px solid #383838;
padding:15px 0;
}
h3{font-size:12px;color:#aaa;letter-spacing:1px}
button,select{
background:#292b30;
color:white;
padding:12px;
border:1px solid #555;
border-radius:8px;
margin:4px;
}
button:disabled{opacity:.4}
#record{
background:#d52d35;
border:3px solid white;
border-radius:50%;
width:65px;
height:65px;
}
#record.active{border-radius:12px}
.result{
background:#191b20;
padding:15px;
border-radius:8px;
line-height:1.8;
}
#actual{
font-size:23px;
font-weight:bold;
color:#59d995;
}
.warning{color:#ffb347}
.success{color:#59d995}
a{color:#83caff;display:block;margin:12px 0}
</style>
</head>

<body>

<header>
<div class="brand">PRO <span class="red">CINEMA V4</span></div>
<div id="timer" class="red">00:00:00</div>
</header>

<video id="preview" autoplay playsinline muted></video>

<div class="panel">

<section>
<button onclick="startCamera()">START CAMERA</button>
<button onclick="flipCamera()">FLIP</button>
</section>

<section>
<h3>VIDEO RESOLUTION</h3>

<select id="resolution">
<option value="1280">720P HD</option>
<option value="1920" selected>1080P FULL HD</option>
<option value="3840">4K UHD EXPERIMENTAL</option>
</select>

<select id="fps">
<option value="24">24 FPS</option>
<option value="30" selected>30 FPS</option>
<option value="60">60 FPS</option>
</select>

<button onclick="startCamera()">APPLY SETTINGS</button>
</section>

<section>
<h3>ACTUAL CAMERA OUTPUT</h3>

<div class="result">
<div id="actual">NOT TESTED</div>
<div id="actualFPS">FPS: --</div>
<div id="quality">Waiting for camera...</div>
</div>
</section>

<section>
<h3>VIDEO RECORDING</h3>
<button id="record" onclick="toggleRecord()" disabled></button>
<div id="recordStatus">Camera not started</div>
<div id="downloads"></div>
</section>

<section>
<h3>CAMERA STATUS</h3>
<div id="status">Press START CAMERA.</div>
</section>

</div>

<script>
const $=id=>document.getElementById(id);

let stream=null;
let recorder=null;
let chunks=[];
let facing="environment";
let recording=false;
let seconds=0;
let interval=null;

async function startCamera(){

if(recording){
$("status").textContent="Stop recording first.";
return;
}

if(stream){
stream.getTracks().forEach(t=>t.stop());
stream=null;
}

$("record").disabled=true;
$("actual").textContent="TESTING...";
$("quality").textContent="Checking requested resolution...";

let requested=Number($("resolution").value);
let fps=Number($("fps").value);

try{

// Request the selected resolution.
// 4K uses exact constraints so it cannot silently
// fall back and pretend to be native 4K.

let constraints={
audio:true,
video:{
facingMode:{ideal:facing},
frameRate:{ideal:fps}
}
};

if(requested===3840){
constraints.video.width={exact:3840};
constraints.video.height={exact:2160};
}else{
constraints.video.width={ideal:requested};
constraints.video.height={ideal:Math.round(requested*9/16)};
}

stream=await navigator.mediaDevices.getUserMedia(constraints);

let video=$("preview");
video.srcObject=stream;
await video.play();

let track=stream.getVideoTracks()[0];
let settings=track.getSettings();

let width=settings.width||video.videoWidth;
let height=settings.height||video.videoHeight;
let actualFps=settings.frameRate||"Unknown";

$("actual").textContent=width+" × "+height;
$("actualFPS").textContent="FPS: "+actualFps;

let pixels=width*height;

if(pixels>=3840*2160){
$("quality").innerHTML=
'<span class="success">4K camera output detected!</span>';
}else if(pixels>=1920*1080){
$("quality").innerHTML=
'<span class="warning">Full HD camera output detected.</span>';
}else{
$("quality").textContent="Camera output is below Full HD.";
}

$("record").disabled=false;
$("recordStatus").textContent="Ready to record.";
$("status").textContent="Camera ready. Actual output verified through camera settings.";

}catch(error){

$("actual").textContent="NOT AVAILABLE";
$("actualFPS").textContent="FPS: --";

$("quality").innerHTML=
'<span class="warning">Selected resolution unavailable.</span>';

$("status").textContent="Camera error: "+error.message;

}
}

async function flipCamera(){
if(recording)return;
facing=facing==="environment"?"user":"environment";
await startCamera();
}

function toggleRecord(){

if(recording){
recorder.stop();
return;
}

if(!stream){
$("recordStatus").textContent="Start camera first.";
return;
}

if(!window.MediaRecorder){
$("recordStatus").textContent="Recording unsupported.";
return;
}

try{

let types=[
"video/webm;codecs=vp8,opus",
"video/webm",
"video/mp4"
];

let mime=types.find(t=>MediaRecorder.isTypeSupported(t));

chunks=[];

recorder=new MediaRecorder(
stream,
mime?{mimeType:mime}:{}
);

recorder.ondataavailable=e=>{
if(e.data.size>0)chunks.push(e.data);
};

recorder.onstop=()=>{

recording=false;
clearInterval(interval);

$("record").classList.remove("active");
$("recordStatus").textContent="Recording complete.";

if(!chunks.length){
$("recordStatus").textContent="No video data received.";
return;
}

let type=recorder.mimeType||"video/webm";
let ext=type.includes("mp4")?"mp4":"webm";

let blob=new Blob(chunks,{type});
let url=URL.createObjectURL(blob);

let link=document.createElement("a");
link.href=url;
link.download="PRO_CINEMA_V4_"+Date.now()+"."+ext;
link.textContent="DOWNLOAD RECORDED VIDEO";

$("downloads").appendChild(link);

};

recorder.onerror=()=>{
$("recordStatus").textContent="Recording error.";
};

recorder.start(1000);
recording=true;
seconds=0;

$("record").classList.add("active");
$("recordStatus").textContent="Recording...";

interval=setInterval(()=>{

seconds++;

let h=String(Math.floor(seconds/3600)).padStart(2,"0");
let m=String(Math.floor(seconds%3600/60)).padStart(2,"0");
let s=String(seconds%60).padStart(2,"0");

$("timer").textContent=h+":"+m+":"+s;

},1000);

}catch(error){
$("recordStatus").textContent=error.message;
}
}
</script>

</body>
</html>
