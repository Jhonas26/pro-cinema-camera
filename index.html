<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101010"><title>PRO CINEMA CAMERA</title><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:white;font:14px system-ui}header,.toolbar,.controls{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px}header{font-weight:700}.tag{color:#ff5555}.stage{position:relative;background:black;width:100%;aspect-ratio:9/16;max-height:68dvh;overflow:hidden}video{width:100%;height:100%;object-fit:cover}.bars:before,.bars:after{content:"";position:absolute;left:0;right:0;height:12%;background:#0009;pointer-events:none}.bars:before{top:0}.bars:after{bottom:0}.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 33.2%,#ffffff55 33.33%,transparent 33.5%,transparent 66.5%,#ffffff55 66.67%,transparent 66.8%),linear-gradient(transparent 33.2%,#ffffff55 33.33%,transparent 33.5%,transparent 66.5%,#ffffff55 66.67%,transparent 66.8%)}button,a{background:#282828;border:1px solid #555;color:white;padding:10px;border-radius:9px;text-decoration:none}button:disabled{opacity:.4}#record{background:#e23b3b;border-radius:50%;width:68px;height:68px;border:5px solid white}#record.active{border-radius:12px;width:55px;height:55px}.controls{justify-content:center;gap:30px}.toolbar{flex-wrap:wrap;justify-content:center}input{width:130px}#status{color:#aaa;text-align:center;min-height:22px;padding:5px}a{display:none;text-align:center;margin:8px auto;width:max-content}</style></head><body><header><span>PRO CINEMA CAMERA</span><span class="tag" id="timer">00:00</span></header><div class="stage"><video id="preview" autoplay playsinline muted></video><div class="bars" id="bars"></div><div class="grid" id="grid" hidden></div></div><div class="toolbar"><button id="start">Start camera</button><button id="flip">Flip</button><button id="guides">Guides</button><label>Zoom <span id="zoomText">1x</span> <input id="zoom" type="range" min="1" max="1" step="0.1" value="1" disabled></label></div><div class="controls"><button id="record" disabled aria-label="Record"></button></div><div id="status">Allow camera and microphone access to begin.</div><a id="save">Save recording</a><script>
const $=id=>document.getElementById(id);let stream=null,recorder=null,chunks=[],facing='environment',seconds=0,tick=null,recording=false,objectUrl=null;function status(s){$('status').textContent=s}function stopTracks(){if(stream)stream.getTracks().forEach(t=>t.stop())}async function camera(){if(recording)return;stopTracks();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},audio:true});$('preview').srcObject=stream;await $('preview').play();$('record').disabled=false;let track=stream.getVideoTracks()[0],cap=track.getCapabilities?.()||{};let z=cap.zoom;if(z){$('zoom').disabled=false;$('zoom').min=z.min;$('zoom').max=z.max;$('zoom').step=z.step||0.1;$('zoom').value=track.getSettings().zoom||z.min;$('zoomText').textContent=Number($('zoom').value).toFixed(1)+'x'}else{$('zoom').disabled=true;$('zoomText').textContent='N/A'}status('Ready • '+(track.getSettings().width||'?')+'×'+(track.getSettings().height||'?'))}catch(e){status('Camera error: '+e.message+' (Use HTTPS or localhost.)')}}$('start').onclick=camera;$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';camera()};$('guides').onclick=()=>{$('grid').hidden=!$('grid').hidden};$('zoom').oninput=async()=>{let t=stream?.getVideoTracks()[0];if(!t)return;try{await t.applyConstraints({advanced:[{zoom:Number($('zoom').value)}]});$('zoomText').textContent=Number($('zoom').value).toFixed(1)+'x'}catch(e){status('Zoom not supported: '+e.message)}};function time(){seconds++;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}$('record').onclick=()=>{if(!stream)return;if(recording){recorder.stop();return}if(!window.MediaRecorder){status('Recording unsupported in this browser');return}let mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));try{recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{recording=false;clearInterval(tick);$('record').classList.remove('active');$('flip').disabled=false;$('start').disabled=false;let blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);$('save').href=objectUrl;$('save').download='cinema-'+Date.now()+'.webm';$('save').style.display='block';status('Recording ready to save')};recorder.start(1000);recording=true;seconds=0;$('timer').textContent='00:00';tick=setInterval(time,1000);$('record').classList.add('active');$('flip').disabled=true;$('start').disabled=true;$('save').style.display='none';status('Recording…')}catch(e){status('Recording error: '+e.message)}};window.addEventListener('pagehide',stopTracks);
</script></body></html>
