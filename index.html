
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PRO CINEMA CAMERA V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{height:55px;display:flex;align-items:center;justify-content:space-between;padding:12px;background:#151515}
.red{color:#ff4545}
#viewer{position:relative;width:100%;height:55vh;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain}
#overlay{position:absolute;inset:0;pointer-events:none}
.thirds{background:linear-gradient(90deg,transparent 33.2%,#ffffff90 33.3%,transparent 33.5%,transparent 66.5%,#ffffff90 66.6%,transparent 66.8%),linear-gradient(0deg,transparent 33.2%,#ffffff90 33.3%,transparent 33.5%,transparent 66.5%,#ffffff90 66.6%,transparent 66.8%)}
.cross:after{content:"+";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:35px;color:#fff9}
.cinema:before,.cinema:after{content:"";position:absolute;left:0;width:100%;height:12%;background:#000b}
.cinema:before{top:0}
.cinema:after{bottom:0}
.controls{padding:16px;text-align:center}
button,select{background:#262626;color:white;border:1px solid #555;border-radius:9px;padding:12px;margin:4px}
button:active{background:#555}
input{width:65%;accent-color:#ff4545}
#record{width:72px;height:72px;border-radius:50%;background:#d52d35;border:6px solid #aaa;margin:20px}
#record.active{border-radius:15px;background:red}
small{color:#aaa}
a{color:#7fcaff;display:block;margin:12px}
</style>
</head>
<body>

<header>
<strong>PRO CINEMA <span class="red">V2</span></strong>
<strong id="timer" class="red">00:00</strong>
</header>

<div id="viewer">
<video id="preview" autoplay playsinline muted></video>
<div id="overlay"></div>
</div>

<div class="controls">
<button onclick="startCamera()">Start Camera</button>
<button onclick="flipCamera()">Flip</button>

<p>
Guides:
<select id="guides" onchange="setGuides()">
<option value="">OFF</option>
<option value="thirds">Rule of Thirds</option>
<option value="cross">Center Crosshair</option>
<option value="cinema">Cinema Frame</option>
</select>
</p>

<p>
Zoom <span id="zoomText">1.0x</span>
<input id="zoom" type="range" min="1" max="4" step=".1" value="1" oninput="setZoom()">
</p>

<button id="record" onclick="toggleRecord()"></button>
<br>
<small id="status">Allow camera and microphone to begin.</small>
<div id="downloads"></div>
</div>

<script>
let stream=null;
let recorder=null;
let chunks=[];
let recording=false;
let seconds=0;
let timerInterval=null;
let facing="environment";
let currentZoom=1;

const video=document.getElementById("preview");
const statusText=document.getElementById("status");
const zoomInput=document.getElementById("zoom");

function setGuides(){
document.getElementById("overlay").className=
document.getElementById("guides").value;
}

async function startCamera(){
try{
if(recording)return;
if(stream)stream.getTracks().forEach(t=>t.stop());

stream=await navigator.mediaDevices.getUserMedia({
audio:true,
video:{
facingMode:{ideal:facing},
width:{ideal:1920},
height:{ideal:1080}
}
});

video.srcObject=stream;
await video.play();

const track=stream.getVideoTracks()[0];
const caps=track.getCapabilities?.()||{};

if(caps.zoom){
zoomInput.min=caps.zoom.min;
zoomInput.max=caps.zoom.max;
zoomInput.step=caps.zoom.step||0.1;
currentZoom=Math.max(caps.zoom.min,Math.min(1,caps.zoom.max));
zoomInput.value=currentZoom;
}else{
zoomInput.min=1;
zoomInput.max=4;
zoomInput.step=.1;
zoomInput.value=1;
currentZoom=1;
}

await setZoom();
statusText.textContent="Camera ready";
}catch(e){
statusText.textContent="Camera error: "+e.message;
}
}

async function flipCamera(){
if(recording)return;
facing=facing==="environment"?"user":"environment";
await startCamera();
}

async function setZoom(){
if(!stream)return;

let track=stream.getVideoTracks()[0];
let caps=track.getCapabilities?.()||{};
let z=Number(zoomInput.value);

if(caps.zoom){
try{
await track.applyConstraints({
advanced:[{zoom:z}]
});
video.style.transform="scale(1)";
}catch(e){
statusText.textContent="Zoom not supported";
}
}else{
video.style.transform="scale("+z+")";
}

currentZoom=z;
document.getElementById("zoomText").textContent=z.toFixed(1)+"x";
}

function toggleRecord(){
if(recording){
recorder.stop();
return;
}

if(!stream){
statusText.textContent="Start camera first";
return;
}

if(!window.MediaRecorder){
statusText.textContent="Recording not supported";
return;
}

let mime=[
"video/webm;codecs=vp8,opus",
"video/webm"
].find(t=>MediaRecorder.isTypeSupported(t));

try{
chunks=[];
recorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});

recorder.ondataavailable=e=>{
if(e.data.size)chunks.push(e.data);
};

recorder.onstop=()=>{
recording=false;
clearInterval(timerInterval);
document.getElementById("record").classList.remove("active");

let blob=new Blob(chunks,{
type:recorder.mimeType||"video/webm"
});

let url=URL.createObjectURL(blob);
let a=document.createElement("a");
a.href=url;
a.download="PRO_CINEMA_"+Date.now()+".webm";
a.textContent="Download recorded video";
document.getElementById("downloads").appendChild(a);

statusText.textContent="Recording saved. Tap download.";
};

recorder.start();
recording=true;
seconds=0;
document.getElementById("record").classList.add("active");
statusText.textContent="Recording...";

timerInterval=setInterval(()=>{
seconds++;
let m=String(Math.floor(seconds/60)).padStart(2,"0");
let s=String(seconds%60).padStart(2,"0");
document.getElementById("timer").textContent=m+":"+s;
},1000);

}catch(e){
statusText.textContent="Recording error: "+e.message;
}
}
</script>
</body>
</html>
